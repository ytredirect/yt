<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>redirect</title>
  <style>
    /* Pure black background, zero margins, full height */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* DIN Mittelschrift with wider tracking and slightly bolder weight */
    .redirect-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-family: "DIN Mittelschrift", "DIN 1451 Mittelschrift", "DIN Mittelschrift Regular", "Arial", sans-serif;
      font-weight: 600;
      font-size: 1.25rem;
      letter-spacing: 0.35em;
      text-transform: lowercase;
      cursor: pointer;
      outline: none;
      padding: 20px;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>

  <!-- SIMPLE TEXT BUTTON -->
  <button class="redirect-btn" onclick="openYouTubeApp()">ryoji mario jumpspot</button>

  <script>
    // =========================================================================
    // 1. PUT YOUR YOUTUBE LINK HERE (Video, Short, or Channel Link)
    // =========================================================================
    const TARGET_YOUTUBE_URL = "https://www.youtube.com/watch?v=dQw4w9WgXcQ";
    // =========================================================================

    function openYouTubeApp() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      const isIOS = /iPad|iPhone|iPod/.test(userAgent) && !window.MSStream;
      const isAndroid = /Android/i.test(userAgent);

      // Extract Video ID or Channel handle/path
      let rawUrl = TARGET_YOUTUBE_URL.replace(/^https?:\/\//, '');

      if (isAndroid) {
        // Universal Android Intent scheme to force launch the native YouTube app from Instagram WebView
        const intentUrl = "intent://" + rawUrl + "#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url=" + encodeURIComponent(TARGET_YOUTUBE_URL) + ";end";
        window.location.href = intentUrl;
      } else if (isIOS) {
        // Direct iOS custom app scheme trigger
        const iosSchemeUrl = "youtube://" + rawUrl;
        
        // Attempt custom scheme first
        window.location.href = iosSchemeUrl;
        
        // Fallback to web URL if app fails to launch within 1.5s
        setTimeout(() => {
          window.location.href = TARGET_YOUTUBE_URL;
        }, 1500);
      } else {
        // Fallback for standard browsers / Desktop
        window.location.href = TARGET_YOUTUBE_URL;
      }
    }
  </script>

</body>
</html>
